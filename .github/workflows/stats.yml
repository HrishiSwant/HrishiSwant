name: Generate GitHub Stats SVG

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours, same cadence as the snake workflow
  workflow_dispatch:          # lets you trigger it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate stats.svg
        env:
          GH_USERNAME: HrishiSwant
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: python scripts/generate_stats.py assets/stats.svg

      - name: Commit updated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update stats.svg [skip ci]"
          git push
