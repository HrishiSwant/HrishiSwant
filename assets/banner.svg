<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#050505"/>
<stop offset="100%" stop-color="#131313"/>
</linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#ff7a00"/>
<stop offset="100%" stop-color="#ff3b00"/>
</linearGradient>
<filter id="glow">
<feGaussianBlur stdDeviation="3" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M40 0H0V40" fill="none" stroke="#1d1d1d" stroke-width="1"/>
</pattern>
</defs>

<rect width="1280" height="720" fill="url(#bg)"/>
<rect width="1280" height="720" fill="url(#grid)" opacity=".4"/>

<circle cx="1050" cy="360" r="170" fill="#ff6a00" opacity=".08">
<animate attributeName="r" values="170;195;170" dur="6s" repeatCount="indefinite"/>
</circle>

<text x="70" y="70" font-size="30" font-family="monospace" fill="#ff7a00">HS://INFERNO</text>

<text x="70" y="120" font-size="18" font-family="monospace" fill="#8d8d8d">&gt; boot_sequence.sh</text>

<g font-family="monospace" font-size="18">
<text x="70" y="170" fill="#fff">█ Initializing Environment...</text>
<text x="70" y="200" fill="#fff">█ Connecting GitHub...</text>
<text x="70" y="230" fill="#fff">█ Loading FROST...</text>
<text x="70" y="260" fill="#fff">█ Loading AI Modules...</text>
<text x="70" y="290" fill="#7dff7d">█ ACCESS GRANTED</text>
</g>

<rect x="70" y="320" width="420" height="10" rx="5" fill="#222"/>
<rect x="70" y="320" width="0" height="10" rx="5" fill="url(#accent)">
<animate attributeName="width" values="0;420" dur="2.5s" fill="freeze"/>
</rect>

<text x="70" y="410" font-size="58" font-family="sans-serif" font-weight="700" fill="url(#accent)" filter="url(#glow)">
Hrishikesh Sawant
</text>
<text x="70" y="455" font-size="28" font-family="sans-serif" fill="#ffffff">
Software Developer
</text>

<text x="70" y="500" font-size="22" fill="#bcbcbc">Building secure, scalable and intelligent software.</text>

<g font-family="sans-serif" font-size="14">
<rect x="70" y="550" width="90" height="34" rx="17" fill="#151515" stroke="#ff6a00"/><text x="98" y="572" fill="#fff">JAVA</text>
<rect x="170" y="550" width="100" height="34" rx="17" fill="#151515" stroke="#ff6a00"/><text x="194" y="572" fill="#fff">PYTHON</text>
<rect x="280" y="550" width="90" height="34" rx="17" fill="#151515" stroke="#ff6a00"/><text x="306" y="572" fill="#fff">REACT</text>
<rect x="380" y="550" width="90" height="34" rx="17" fill="#151515" stroke="#ff6a00"/><text x="415" y="572" fill="#fff">AI</text>
</g>

<!-- Avatar Frame -->
<rect x="840" y="100"
      width="340"
      height="460"
      rx="20"
      fill="#111"
      stroke="#ff6a00"/>

<!-- Clip image inside frame -->
<defs>
    <clipPath id="avatarClip">
        <rect x="840" y="100"
              width="340"
              height="460"
              rx="20"/>
    </clipPath>
</defs>

<image
    href="./assets/avatar.png"
    x="840"
    y="100"
    width="340"
    height="460"
    preserveAspectRatio="xMidYMid slice"
    clip-path="url(#avatarClip)"
/>

<line x1="840" x2="1180" y1="100" y2="100" stroke="#ff6a00" stroke-width="2">
<animate attributeName="y1" values="100;560;100" dur="4s" repeatCount="indefinite"/>
<animate attributeName="y2" values="100;560;100" dur="4s" repeatCount="indefinite"/>
</line>

<circle cx="980" cy="640" r="6" fill="#00ff6a">
<animate attributeName="opacity" values="1;.2;1" dur="1s" repeatCount="indefinite"/>
</circle>
<text x="995" y="646" fill="#fff" font-family="monospace" font-size="18">ONLINE · PROJECT: FROST</text>
</svg>
